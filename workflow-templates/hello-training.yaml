apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: hello-training
  annotations:
    scenarios.ai.sap.com/description: "Simple Hello World Training"
    scenarios.ai.sap.com/name: "hello-world"
    executables.ai.sap.com/description: "Training executable"
    executables.ai.sap.com/name: "training"
  labels:
    scenarios.ai.sap.com/id: "hello-world"
    ai.sap.com/version: "1.0"
spec:
  imagePullSecrets:
    - name: default-docker-registry
  entrypoint: main
  templates:
  - name: main
    container:
      image: python:3.9-slim
      command:
        - sh
        - -c
        - |
          echo "=== AI Training Started ==="
          echo "Loading dataset..."
          sleep 5
          echo "Training model..."
          sleep 10
          echo "Model training completed!"
          echo "=== Training Finished ==="
